<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Cinematic Background with Blur -->
        <div class="bg-overlay"></div>

        <div class="signup-content">
            <!-- Header/Logo Section (Smaller for Sign Up to fit fields) -->
            <div class="logo-section">
                <h1 class="logo-large">CINELINK</h1>
                <p class="tagline-large">Create Your Account.</p>
            </div>

            <!-- Sign Up Form Area -->
            <div class="form-area" id="signup-form">
                
                <!-- Full Name -->
                <div class="input-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" placeholder="Full Name" id="name-input">
                </div>

                <!-- Email -->
                <div class="input-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" placeholder="Email Address" id="email-input">
                </div>
                
                <!-- Password -->
                <div class="input-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" placeholder="Create Password" id="password-input">
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <polyline points="9 12 11 14 15 10"></polyline>
                        </svg>
                    </span>
                    <input type="password" placeholder="Confirm Password" id="confirm-password-input">
                </div>

                <!-- Terms & Conditions -->
                <div class="terms-check">
                    <input type="checkbox" id="terms-checkbox">
                    <label for="terms-checkbox">I agree to the <span>Terms</span> and <span>Privacy Policy</span></label>
                </div>

                <button class="auth-btn" id="signup-btn">Create Account</button>

                <p class="switch-form">Already have an account? <span onclick="window.location.href='login.html'">Log In</span></p>
            </div>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
