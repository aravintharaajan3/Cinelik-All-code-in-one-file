<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="bg-overlay"></div>

        <div class="signup-content">
            <div class="logo-section">
                <h1 class="logo-large">CINELINK</h1>
                <p class="tagline-large">Create Your Account.</p>
            </div>

            <div class="form-area" id="signup-form">

                <div class="input-group" id="name-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" placeholder="Full Name" id="name">
                </div>

                <div class="input-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" opacity="0.3"></path>
                        </svg>
                    </span>
                    <input type="text" placeholder="Mobile number or email address" id="contact-info">
                </div>

                <div class="input-group" id="password-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" placeholder="Create Password" id="password">
                </div>

                <div class="input-group" id="confirm-password-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <polyline points="9 12 11 14 15 10"></polyline>
                        </svg>
                    </span>
                    <input type="password" placeholder="Confirm Password" id="confirm-password">
                </div>

                <div class="input-group" id="otp-group" style="display: none; border-color: var(--gold);">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="number" placeholder="Enter 6-digit OTP" id="otp-input" style="letter-spacing: 3px; font-weight: bold;">
                </div>

                <div class="terms-check" id="terms-group">
                    <input type="checkbox" id="terms-checkbox">
                    <label for="terms-checkbox">I agree to the <span>Terms</span> and <span>Privacy Policy</span></label>
                </div>

                <div id="recaptcha-container"></div>

                <button class="auth-btn" id="signupBtn">Create Account</button>
                <button class="auth-btn" id="verifyBtn" style="display: none; background: #17BF63; color: white;">Verify OTP & Create Account</button>

                <p class="switch-form" id="switch-login-text">Already have an account? <span onclick="window.location.href='login.html'">Log In</span></p>
            </div>
        </div>
    </div>

    <script type="module" src="signup.js"></script>
</body>
</html>
