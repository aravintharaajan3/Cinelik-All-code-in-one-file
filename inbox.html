<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - Messages</title>
    <link rel="stylesheet" href="inbox.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <header class="inbox-header">
            <div class="back-btn" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <h2 class="inbox-title">Messages</h2>
            <div class="edit-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Search messages...">
            </div>
        </div>

        <main class="content">
            <div class="messages-list">
                
                <div class="chat-item" onclick="window.location.href='chat.html?user=karthik'">
                    <div class="chat-avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" alt="Karthik">
                        <div class="online-dot"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <h4>Karthik Raj <span class="verified">✔</span></h4>
                            <span class="time">10:35 AM</span>
                        </div>
                        <div class="chat-bottom">
                            <p class="unread-text">Are you available for a quick audition t...</p>
                            <div class="unread-count">2</div>
                        </div>
                    </div>
                </div>

                <div class="chat-item" onclick="window.location.href='chat.html?user=vikram'">
                    <div class="chat-avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80" alt="Vikram">
                    </div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <h4>Vikram Editz</h4>
                            <span class="time">Yesterday</span>
                        </div>
                        <div class="chat-bottom">
                            <p>Let's collaborate on the next short film. I ha...</p>
                        </div>
                    </div>
                </div>

                <div class="chat-item" onclick="window.location.href='chat.html?user=meera'">
                    <div class="chat-avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Meera">
                    </div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <h4>Meera Krishnan <span class="verified">✔</span></h4>
                            <span class="time">Mon</span>
                        </div>
                        <div class="chat-bottom">
                            <p>Loved your recent post! Keep it up. 🎬</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
