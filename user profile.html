<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - User Profile</title>
    <link rel="stylesheet" href="user profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="profile-header">
            <div class="back-btn" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <div class="header-actions">
                <span class="icon">⋮</span>
            </div>
        </header>

        <main class="content">
            <div class="profile-top">
                <div class="avatar-container">
                    <img id="up-avatar" src="" alt="Avatar" class="avatar-img">
                    <div class="verified-badge">✔</div>
                </div>
            </div>

            <div class="user-details">
                <h1 id="up-name">Loading...</h1>
                <p class="role-location"><span id="up-role">Role</span> • <span id="up-loc">Location</span></p>
                <p class="bio" id="up-bio">Loading bio...</p>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <h3 id="up-stat-proj">-</h3>
                    <p>Projects</p>
                </div>
                <div class="stat-box">
                    <h3 id="up-stat-fol">-</h3>
                    <p>Followers</p>
                </div>
                <div class="stat-box">
                    <h3 id="up-stat-flg">-</h3>
                    <p>Following</p>
                </div>
            </div>

            <div class="action-buttons">
                <button class="follow-btn" id="follow-btn" onclick="toggleFollow()">Follow</button>
                <button class="msg-btn" onclick="window.location.href='chat.html?user=' + (new URLSearchParams(window.location.search).get('user') || 'karthik')">Message</button>
            </div>

            <div class="portfolio-section">
                <h3>Portfolio / Showreels</h3>
                <div class="portfolio-grid" id="up-portfolio">
                    </div>
            </div>
        </main>
    </div>

    <script src="user profile.js"></script>
</body>
</html>
