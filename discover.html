<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - Discover</title>
    <link rel="stylesheet" href="discover.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-left"></div>
            <div class="logo-container">
                <h1 class="logo">CINELINK</h1>
                <p class="tagline">Discover Talent. Create Cinema</p>
            </div>
            <div class="header-actions">
                <div class="notification" onclick="window.location.href='notifications.html'" style="cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="badge">3</span>
                </div>
                <div class="filter-btn" onclick="alert('Filter options coming soon!')" style="cursor: pointer;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    <small>Filter</small>
                </div>
            </div>
        </header>

        <main class="content">
            <h2 class="page-title">Discover</h2>
            <p class="page-subtitle">Find the perfect talent for your next project</p>

            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" placeholder="Search by name, skill, location...">
            </div>

           <div class="categories" style="display: flex; overflow-x: auto; gap: 20px; padding: 10px 0; scrollbar-width: none;">
                <div class="category-item active" onclick="selectCategory(this)" style="cursor: pointer;">
                    <div class="icon-circle">⭐</div><span>All</span>
                </div>
                <div class="category-item" onclick="selectCategory(this)" style="cursor: pointer;">
                    <div class="icon-circle">🎭</div><span>Actors</span>
                </div>
                <div class="category-item" onclick="selectCategory(this)" style="cursor: pointer;">
                    <div class="icon-circle">👩‍🎤</div><span>Actresses</span>
                </div>
                <div class="category-item" onclick="selectCategory(this)" style="cursor: pointer;">
                    <div class="icon-circle">🎬</div><span>Directors</span>
                </div>
                <div class="category-item" onclick="selectCategory(this)" style="cursor: pointer;">
                    <div class="icon-circle">✂️</div><span>Editors</span>
                </div>
            </div>

            <div class="section-header"><h3>🔥 Trending Talent</h3><a href="#">See All ></a></div>
            <div class="horizontal-scroll" id="trending-container"></div>

            <div class="section-header"><h3>✅ Verified Talent</h3><a href="#">See All ></a></div>
            <div class="horizontal-scroll" id="verified-container"></div>
            
            <div style="height: 80px;"></div> 
        </main>

        <nav class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='index.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="label">Home</span>
            </div>
            <div class="nav-item active" onclick="window.location.href='discover.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span class="label">Discover</span>
            </div>
            
            <div class="nav-item center-reels" onclick="window.location.href='reels.html'">
                <div class="reels-btn-wrapper" style="border-color: transparent;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                        <line x1="7" y1="2" x2="7" y2="22"></line>
                        <line x1="17" y1="2" x2="17" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <line x1="2" y1="7" x2="7" y2="7"></line>
                        <line x1="2" y1="17" x2="7" y2="17"></line>
                        <line x1="17" y1="17" x2="22" y2="17"></line>
                        <line x1="17" y1="7" x2="22" y2="7"></line>
                    </svg>
                </div>
            </div>

            <div class="nav-item" onclick="window.location.href='projects.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                <span class="label">Projects</span>
            </div>
            <div class="nav-item" onclick="window.location.href='profile.html'">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span class="label">Profile</span>
            </div>
        </nav>
    </div>
    
    <script type="module" src="discover.js"></script>
    <script>
        // Category Selection UI Logic
        window.selectCategory = function(clickedElement) {
            let categories = document.querySelectorAll('.category-item');
            categories.forEach(function(item) {
                item.classList.remove('active');
            });
            clickedElement.classList.add('active');
        }
    </script>
</body>
</html>
