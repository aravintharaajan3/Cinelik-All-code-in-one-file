<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - Edit Profile</title>
    <link rel="stylesheet" href="edit-profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="edit-header">
            <div class="back-btn" onclick="window.location.href='profile.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <h1 class="header-title">Edit Profile</h1>
            <button class="save-btn" id="save-profile-btn">Save</button>
        </header>

        <main class="content">
            <div class="edit-avatar-section">
                <div class="avatar-wrapper">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="edit-avatar" id="profile-img">
                    <div class="change-photo-badge">📷</div>
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;">
                </div>
                <p class="change-photo-text" id="trigger-photo">Change Profile Photo</p>
            </div>

            <div class="form-section">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" value="Aravinth" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label>Primary Role</label>
                    <input type="text" id="edit-role" value="Founder & Writer" placeholder="e.g. Actor, Director, Editor">
                </div>

                <div class="input-group">
                    <label>Location</label>
                    <input type="text" id="edit-loc" value="Chennai, Tamil Nadu" placeholder="City, State">
                </div>

                <div class="input-group">
                    <label>Bio</label>
                    <textarea id="edit-bio" placeholder="Tell creators about yourself...">Founder of CineLink 🔥 | Exploring the intersection of Cinema and Technology.</textarea>
                </div>

                <div class="input-group">
                    <label>Skills (Comma separated)</label>
                    <input type="text" id="edit-skills" value="Direction, Scriptwriting, Tech" placeholder="E.g. Editing, VFX, Acting">
                </div>

                <h3 class="section-label">Portfolio Links</h3>
                
                <div class="input-group">
                    <label>Showreel / YouTube Link</label>
                    <input type="url" id="edit-yt" placeholder="https://youtube.com/..." value="">
                </div>

                <div class="input-group">
                    <label>Instagram Username</label>
                    <div class="social-input">
                        <span>@</span>
                        <input type="text" id="edit-insta" value="">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="edit-profile.js"></script>
</body>
</html>
